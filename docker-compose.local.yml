# wise-timer — local 모드: dev 스테이지(vite dev, HMR) + 소스 바인드
services:
  web:
    build: { target: dev }
    env_file: [".env.local"]
    command: ["sh", "-c", "pnpm install --frozen-lockfile --prefer-offline && pnpm dev"]
    ports: !override ["${BIND_HOST:-127.0.0.1}:${WEB_PORT:-5173}:5173"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 120s
volumes:
  node_modules:
