# GitHub Pages 배포 — main push 시 test → build(/<repo>/ base) → Pages 배포
# 최초 1회: 저장소 Settings → Pages → Build and deployment → Source = "GitHub Actions"
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: build
        # 사용자/조직 사이트(<user>.github.io 저장소)는 "/", 프로젝트 사이트는 "/<repo>/"
        run: |
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "${{ github.repository_owner }}.github.io" ]; then BASE=/; else BASE="/$REPO/"; fi
          VITE_BASE="$BASE" pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
